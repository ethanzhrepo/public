<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sayloom support and privacy information.">
  <title>Sayloom Support</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    main { max-width: 760px; margin: 0 auto; padding: 72px 24px; }
    .card { background: white; border: 1px solid #e4e8f0; border-radius: 22px; padding: 36px; box-shadow: 0 18px 60px rgba(30, 44, 80, .08); }
    h1 { margin: 0 0 12px; font-size: clamp(2.2rem, 6vw, 4rem); letter-spacing: -.045em; }
    p { color: #526078; font-size: 1.08rem; line-height: 1.7; }
    a { color: #315ee8; font-weight: 650; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 28px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0e1420; color: #eef3ff; }
      .card { background: #151d2c; border-color: #28344a; }
      p { color: #b7c1d6; }
      a { color: #8eafff; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Sayloom</h1>
      <p>A local-first macOS workspace for live transcription, translation, and contextual AI assistance.</p>
      <p>Sayloom processes speech locally whenever a local model is selected. Optional cloud features connect directly to the provider endpoint configured by the user.</p>
      <nav aria-label="Support links">
        <a href="privacy/">Privacy Policy</a>
        <a href="https://github.com/ethanzhrepo/public/issues">Support</a>
      </nav>
    </section>
  </main>
</body>
</html>
